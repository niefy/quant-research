[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Factor mining and validation platform"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "polars>=1.20,<2",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["quant"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
